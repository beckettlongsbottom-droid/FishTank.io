<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fishtank.io</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--deep:#06323f;--tank:#1fb5c9;--brass:#c98a3b;--sun:#ffd23f;--coral:#ff6b6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);font-family:Nunito,system-ui,sans-serif;color:#fff;user-select:none}
canvas{display:block}
#menu{position:fixed;inset:0;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 35%,#06323f33,#06323fd0);overflow:auto}
#menu h1{font:400 clamp(54px,11vw,120px)/1 'Bagel Fat One',sans-serif;margin:0;color:var(--sun);text-shadow:0 6px 0 var(--brass),0 12px 24px #0006}
#menu p{margin:.4em 0 1.2em;font-weight:800;font-size:18px}
#menu input{font:800 20px Nunito;padding:12px 16px;border-radius:14px;border:4px solid var(--brass);width:240px;text-align:center}
#menu button{display:block;margin:16px auto 0;font:400 28px 'Bagel Fat One';padding:12px 44px;border-radius:18px;border:0;background:var(--coral);color:#fff;box-shadow:0 6px 0 #b83b3b;cursor:pointer}
#menu button:active{transform:translateY(4px);box-shadow:0 2px 0 #b83b3b}
#menu small{display:block;margin-top:22px;opacity:.85;line-height:1.7}
#guns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:18px auto 0;max-width:900px}
.gun{width:158px;padding:10px 12px;border-radius:16px;background:#06323fd9;border:4px solid transparent;cursor:pointer;text-align:left;transition:transform .12s}
.gun:hover{transform:translateY(-3px)}.gun.on{border-color:var(--sun);transform:translateY(-6px)}
.gun b{display:block;font:400 16px 'Bagel Fat One';margin-bottom:6px}
.lbl{font-size:12px;font-weight:800;opacity:.85}.bar{height:6px;border-radius:3px;background:#fff3;margin:2px 0 6px}.bar i{display:block;height:100%;border-radius:3px;background:var(--sun)}
#note{min-height:24px;margin-top:14px;font-weight:800;color:var(--sun)}#online{font-weight:800;opacity:.85}
#hud{position:fixed;inset:0;pointer-events:none;display:none}
#cross{position:absolute;left:50%;top:50%;width:18px;height:18px;margin:-9px;border:3px solid #fff;border-radius:50%;opacity:.85}
#hit{position:absolute;left:50%;top:50%;margin:-14px;font:400 28px 'Bagel Fat One';opacity:0;color:var(--sun)}
#vig{position:absolute;inset:0;box-shadow:inset 0 0 120px 40px #ff2a2a;opacity:0;transition:opacity .4s}
#hl{position:absolute;left:24px;bottom:24px;width:260px;font-weight:800;text-shadow:0 2px 0 #0008}#hl .lab{font-size:14px;margin:6px 0 3px;display:flex;justify-content:space-between}
.bar2{height:10px;border-radius:6px;background:#0008;border:2px solid #fff;overflow:hidden}.bar2 i{display:block;height:100%;width:100%;background:linear-gradient(#9be7ff,#3fb6e0)}
#hp{height:26px;border-radius:14px;background:#0008;border:3px solid #fff;overflow:hidden}
#scope{position:absolute;inset:0;display:none;background:radial-gradient(circle at center,transparent 0,transparent 27vmin,#000 27.4vmin)}
#scope:before,#scope:after{content:"";position:absolute;background:#000c}#scope:before{left:50%;top:calc(50% - 27vmin);width:2px;height:54vmin}#scope:after{top:50%;left:calc(50% - 27vmin);height:2px;width:54vmin}
#fps{position:absolute;left:10px;top:8px;font:700 12px monospace;opacity:.7;display:none}
#hpf{height:100%;width:100%;background:linear-gradient(#7dffb0,#2fc46b);transition:width .15s}
#ammo{position:absolute;right:24px;bottom:62px;font:400 56px 'Bagel Fat One';text-align:right;text-shadow:0 3px 0 #0007}
#wname{position:absolute;right:24px;bottom:24px;font-weight:800;font-size:20px}
#slots{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:8px}
#slots div{padding:6px 12px;border-radius:12px;background:#0007;font-weight:800;border:3px solid transparent}
#slots .on{border-color:var(--sun);background:#0009}
#feed{position:absolute;right:20px;top:20px;text-align:right;font-weight:800;line-height:1.7;text-shadow:0 2px 0 #0008}
#board{position:absolute;left:50%;top:90px;transform:translateX(-50%);min-width:360px;background:#06323fdd;border-radius:18px;padding:14px 22px;display:none}
#board table{width:100%;border-collapse:collapse}#board td,#board th{padding:4px 10px;text-align:left}#board th{color:var(--sun)}
#msg{position:absolute;inset:0;display:none;place-items:center;font:400 44px 'Bagel Fat One';text-align:center;text-shadow:0 4px 0 #0008;background:#0004}
</style></head><body>
<div id="menu"><div>
  <h1>Fishtank.io</h1><p>Antique divers. Water guns. One very large aquarium.</p>
  <input id="name" maxlength="14" placeholder="Diver name" autocomplete="off">
  <div id="guns"></div><div id="note"></div><div id="online"></div><button id="play" disabled>Connecting…</button>
  <small>WASD move &middot; Space swim up &middot; Shift boost &middot; Mouse aim &middot; Click fire &middot; Right-click zoom (sniper)<br>R reload &middot; Tab scoreboard &middot; Pick your gun here (1-5) before you dive &middot; M mutes sound</small>
</div></div>
<div id="hud">
  <div id="vig"></div><div id="cross"></div><div id="hit">X</div>
  <div id="feed"></div><div id="board"><table id="bt"></table></div>
  <div id="slots"></div><div id="scope"></div><div id="fps"></div>
  <div id="hl"><div class="lab"><span>Dive Boost</span><span id="bn">READY</span></div><div class="bar2"><i id="bf"></i></div>
  <div class="lab"><span>Diver Integrity</span><span id="hn">100</span></div><div id="hp"><div id="hpf"></div></div></div>
  <div id="ammo"></div><div id="wname"></div><div id="msg"></div>
</div>

    else if (m.t === 'snap') onSnap(m.p);
    else if (m.t === 'me') { if (!dead && !inMenu) { if (m.rel && !me.rel) { relStart = performance.now(); sfxReload(WP[m.w].reload); } if (!m.rel && me.rel) sfxReady(); } me = m; $('hpf').style.width = m.hp + '%'; $('hn').textContent = Math.ceil(m.hp); $('ammo').textContent = m.rel ? 'Reloading…' : m.ammo === 0 ? 'Empty! Press R' : m.ammo + ' / ' + WP[m.w].mag; }
    else if (m.t === 'shot') onShot(m);
    else if (m.t === 'proj') onProj(m);
    else if (m.t === 'pop') onPop(m);
    else if (m.t === 'hit') { sfxHit(m.head); flash('hit'); $('hit').style.color = m.head ? '#ff6b6b' : '#ffd23f'; }
    else if (m.t === 'hurt') { flash('vig'); sfxHurt(); }
    else if (m.t === 'boost') onBoost(m);
    else if (m.t === 'kill') feed(m.self ? `${m.v} popped themselves with ${m.w}` : `${m.k} popped ${m.v} with ${m.w}${m.head ? ' (headshot)' : ''}`);
    else if (m.t === 'dead') { sfxDeath(); dead = true; firing = false; zoom = false; showMsg(`Popped by ${m.by}`); setTimeout(() => toMenu(m.by), 1600); }
  };
  ws.onclose = () => { dead = true; $('menu').style.display = 'none'; $('hud').style.display = 'block'; showMsg('Disconnected. Refresh to rejoin.'); };
}

// ---------- loop ----------
let last = performance.now(), ambient = 0, fpsN = 0, fpsLast = performance.now();
function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(), dt = Math.min(.05, (now - last) / 1000); last = now;
  fpsN++; if (now - fpsLast >= 1000) { const f = fpsN * 1000 / (now - fpsLast); $('fps').textContent = Math.round(f) + ' fps'; if (f < 55 && pr > .6) { pr -= .15; R.setPixelRatio(pr); } fpsN = 0; fpsLast = now; }   // adaptive resolution keeps us near 60
  if (!dead && !inMenu && document.pointerLockElement === R.domElement) {
    physics(dt); if (firing) fire();
    if (now - lastSend > 33) { lastSend = now; ws.send(JSON.stringify({ t: 'state', x: pos.x, y: pos.y, z: pos.z, yaw, pitch })); }
  }
  if (inMenu) { menuAng += dt * .12; C.position.set(0, 9, 0); C.rotation.set(-.2, menuAng, 0, 'YXZ'); }   // slow live panorama from above the castle
  else { C.position.set(pos.x, pos.y + 1.7, pos.z); C.rotation.set(pitch, yaw, 0, 'YXZ'); }
  C.fov += ((zoom ? WP[cur].scope || 75 : 75) - C.fov) * .25; C.updateProjectionMatrix();
  const sc = zoom && C.fov < 45; if (sc !== scoped) { scoped = sc; $('scope').style.display = sc ? 'block' : 'none'; $('cross').style.display = sc ? 'none' : 'block'; }
  vm.visible = !zoom && !dead && !inMenu;
  recoil *= .85; vm.position.z = -.6 + recoil; vm.rotation.x = recoil * .8; vm.rotation.z = 0; vm.position.y = -.26; vm.userData.tank.scale.y = 1;
  if (me.rel && !inMenu && !dead) {                  // reload animation: gun tips, its tank refills, bubbles stream up
    const rp = clamp((now - relStart) / WP[cur].reload, 0, 1), sn = Math.sin(rp * Math.PI);
    vm.rotation.z = sn * .6; vm.position.y = -.26 - sn * .12; vm.userData.tank.scale.y = .2 + .8 * rp;
    if (Math.random() < .6) { vm.userData.tank.getWorldPosition(_t); bubble(_t.x + rnd(-.05, .05), _t.y + .1, _t.z + rnd(-.05, .05), rnd(.02, .05), 0, rnd(1, 1.8)); }
  }
  if (!inMenu) { const left = Math.max(0, boostReady - now); $('bf').style.width = Math.round((1 - left / boostCD) * 100) + '%'; const bt = left ? (left / 1000).toFixed(1) + 's' : 'READY'; if (bt !== lastBT) { lastBT = bt; $('bn').textContent = bt; } }
  if (now < myBoostUntil) for (let i = 0; i < 2; i++) bubble(pos.x + rnd(-.4, .4), pos.y + rnd(.2, 1.6), pos.z + rnd(-.4, .4), rnd(.12, .26), 0, rnd(1.5, 3));
  for (const p of players.values()) { const d = p.d; p.g.position.lerp(_t.set(d.x, d.y, d.z), .35); let dy = d.yw - p.g.rotation.y; dy = Math.atan2(Math.sin(dy), Math.cos(dy)); p.g.rotation.y += dy * .35; if (p.boostUntil > now) for (let i = 0; i < 2; i++) bubble(p.g.position.x + rnd(-.4, .4), p.g.position.y + rnd(.2, 1.6), p.g.position.z + rnd(-.4, .4), rnd(.12, .26), 0, rnd(1.5, 3)); }
  for (const [pid, s] of sq) {                       // fly the squids (same straight line the server simulates)
    s.age += dt; s.pos.addScaledVector(s.dir, s.speed * dt);
    s.g.position.copy(s.pos).addScaledVector(s.off, Math.max(0, 1 - s.age / .35));
    s.g.lookAt(s.g.position.x + s.dir.x, s.g.position.y + s.dir.y, s.g.position.z + s.dir.z);
    s.g.userData.tg.rotation.z = Math.sin(s.age * 14) * .35;
    ink(s.g.position.x, s.g.position.y, s.g.position.z, rnd(.45, .75)); if (Math.random() < .3) bubble(s.g.position.x, s.g.position.y, s.g.position.z, rnd(.05, .12), 0, rnd(.5, 1.5));
    if (s.age > 4) { S.remove(s.g); sq.delete(pid); }
  }
  ambient -= dt; if (ambient < 0 && AR) { ambient = .12; bubble(-AR.x + 2 + rnd(-.3, .3), .2, -AR.z + 2 + rnd(-.3, .3), rnd(.08, .22), 5, rnd(2, 3.5)); }
  updatePools(dt, now / 1000); animDecor(now / 1000);
  R.render(S, C);
}

$('play').onclick = () => { if (!ws || ws.readyState !== 1 || !WP[cur]) return; const n = $('name').value.trim() || 'Diver' + Math.floor(rnd(100, 999)); R.domElement.requestPointerLock(); ws.send(JSON.stringify({ t: 'join', name: n, w: cur })); };
$('name').addEventListener('keydown', e => e.key === 'Enter' && $('play').click());
connect();
</script></body></html>
